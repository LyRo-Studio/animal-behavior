services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animal_behavior}
      # No fallback: a hardcoded password default here would be a secret
      # baked into committed configuration (ENGINEERING-STANDARDS.md §2).
      # Set it via .env (copied from .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-animal_behavior}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animal_behavior}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Derived from the same POSTGRES_* vars as the `db` service — a
      # separately hardcoded fallback URL here could silently drift from
      # whatever password `db` actually started with.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-animal_behavior}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-animal_behavior}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # No fallbacks for secrets/credentials — same reasoning as
      # POSTGRES_PASSWORD above. Lifetimes are safe to default.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (see .env.example)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:?Set FIRST_ADMIN_EMAIL in .env (see .env.example)}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?Set FIRST_ADMIN_PASSWORD in .env (see .env.example)}
      # No `:?` here: an unset SMTP_HOST is a legitimate local-dev choice
      # (logs invite emails instead of sending — see app/services/mail.py),
      # not a missing-secret mistake like the vars above.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@vives.be}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      INVITE_TOKEN_EXPIRE_HOURS: ${INVITE_TOKEN_EXPIRE_HOURS:-72}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Brute-force throttling (ticket #7) — see app/core/config.py.
      LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS_PER_IP: ${LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS_PER_IP:-10}
      LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS_PER_EMAIL: ${LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS_PER_EMAIL:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      REFRESH_RATE_LIMIT_MAX_FAILED_ATTEMPTS_PER_IP: ${REFRESH_RATE_LIMIT_MAX_FAILED_ATTEMPTS_PER_IP:-30}
      REFRESH_RATE_LIMIT_WINDOW_SECONDS: ${REFRESH_RATE_LIMIT_WINDOW_SECONDS:-300}
      FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS_PER_IP: ${FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:-10}
      FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS_PER_EMAIL: ${FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS_PER_EMAIL:-5}
      FORGOT_PASSWORD_RATE_LIMIT_WINDOW_SECONDS: ${FORGOT_PASSWORD_RATE_LIMIT_WINDOW_SECONDS:-900}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:4173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
