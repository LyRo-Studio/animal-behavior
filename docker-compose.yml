services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animal_behavior}
      # No fallback: a hardcoded password default here would be a secret
      # baked into committed configuration (ENGINEERING-STANDARDS.md §2).
      # Set it via .env (copied from .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-animal_behavior}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animal_behavior}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Derived from the same POSTGRES_* vars as the `db` service — a
      # separately hardcoded fallback URL here could silently drift from
      # whatever password `db` actually started with.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-animal_behavior}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-animal_behavior}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # No fallback for a secret — same reasoning as POSTGRES_PASSWORD above.
      # Signs the short-lived Cut streaming/download tokens (ADR-0002); the
      # only thing the backend signs since ticket #72 removed its own login.
      MEDIA_TOKEN_SECRET_KEY: ${MEDIA_TOKEN_SECRET_KEY:?Set MEDIA_TOKEN_SECRET_KEY in .env (see .env.example)}
      # Ticket #72: name of the HTTP header Mechatronics forwards the
      # authenticated person's identity in, read for attribution only. No
      # `:?` — unset/empty (local development, or until the real header is
      # discovered on `dogtrace-app`) legitimately means "read no identity".
      IDENTITY_HEADER_NAME: ${IDENTITY_HEADER_NAME:-}
      # Media browser (ticket #18) — see app/services/s3_client.py.
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env (see .env.example)}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env (see .env.example)}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env (see .env.example)}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      # Probed media info for a Cut (ticket #22) — see
      # app/services/media_prober.py. The backend image installs ffmpeg
      # (providing ffprobe) on PATH, so the bare command name default works
      # unchanged.
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-30}
      # Cutting job foundation (ticket #94, part of issue #93's Feature C)
      # — see app/services/cutting_uploads.py. Backed by the
      # cutting_uploads_data volume below so an upload retained after a
      # failed job (or mid-transfer, if the backend restarts) survives a
      # container restart.
      CUTTING_UPLOAD_TEMP_DIR: ${CUTTING_UPLOAD_TEMP_DIR:-/data/cutting-uploads}
      CUTTING_UPLOAD_STORAGE_CAP_BYTES: ${CUTTING_UPLOAD_STORAGE_CAP_BYTES:-53687091200}
      CUTTING_UPLOAD_MAX_FILE_SIZE_BYTES: ${CUTTING_UPLOAD_MAX_FILE_SIZE_BYTES:-21474836480}
    volumes:
      - cutting_uploads_data:/data/cutting-uploads
    # No host port (ticket #71): only `nginx` is reachable from outside the
    # Docker network, so nothing can bypass Mechatronics by hitting the
    # backend directly (ADR-0004). docker-compose.override.yml re-publishes
    # it for local development only.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    # Requires an NVIDIA GPU + nvidia-container-toolkit (see the `deploy`
    # block below) — excluded from a bare `docker compose up` so db/
    # backend/frontend still come up fine on a machine without one (e.g. a
    # contributor's laptop). Explicitly include it with
    # `docker compose --profile worker up`.
    profiles: ["worker"]
    environment:
      # Same DB/S3 config as `backend`, reused as-is (ticket #47) — see
      # app/core/config.py and CONTEXT.md's "Analysis worker" decision.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-animal_behavior}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-animal_behavior}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env (see .env.example)}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env (see .env.example)}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env (see .env.example)}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      ANALYSIS_WORKER_POLL_INTERVAL_SECONDS: ${ANALYSIS_WORKER_POLL_INTERVAL_SECONDS:-5}
      ANALYSIS_WORKER_WORK_DIR: ${ANALYSIS_WORKER_WORK_DIR:-/data/analysis-worker}
    depends_on:
      db:
        condition: service_healthy
    # The production box's GPU (issue #44's concurrency strategy: "the GPU
    # on the production box is a shared, sometimes-contended resource") —
    # only this service ever runs inference; backend/frontend/db stay as
    # they are.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    restart: unless-stopped
    # No host port — see `backend` above.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4173/', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Reverse proxy (ticket #71): `/` -> frontend, `/api/` -> backend, one
  # origin. No `ports:` here on purpose — the host port differs per
  # environment (docker-compose.override.yml locally, docker-compose.prod.yml
  # on the production box, where it is what Mechatronics forwards to).
  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget may try ::1 first, where
      # nginx isn't listening.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  cutting_uploads_data:
