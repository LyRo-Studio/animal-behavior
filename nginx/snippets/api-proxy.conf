# The body of every location that proxies to the backend (included in each).
# `$backend` is set once per server in server-common.conf, not here: a
# `rewrite ... break` in the location stops any `set` that comes after it.
proxy_pass $backend;

# Cut playback/download streams a whole video through here (with Range
# requests for seeking). Buffering it would spool the file to disk
# ahead of the client and keep doing so after the viewer navigates away.
proxy_buffering off;
# `/media/cuts/info` downloads a whole Cut from S3 and then runs ffprobe
# before it answers a single byte, so the wait for the first byte —
# not just the gap between chunks — can be long for a big file.
# Bounded (rather than left open) per ENGINEERING-STANDARDS.md §5, but
# generous: cutting it off earlier only makes the browser retry while
# the backend is still working, which starts a second download.
proxy_read_timeout 300s;
send_timeout 300s;
