# Settings shared by every `server` block in default.conf (included in each).

access_log /dev/stdout redacted;
# nginx's error log quotes the full request line — query string and all —
# on upstream failures, and unlike the access log it can't be redacted.
# `crit` keeps startup/config failures (emerg) and drops those per-request
# lines; a failed upstream still shows up as a 502 in the access log, with
# the cause in `docker compose logs backend`.
error_log /dev/stderr crit;

# Docker's embedded DNS, with the upstreams held in variables so they are
# looked up per request: a redeployed backend/frontend container gets a
# new IP, and nginx would otherwise keep proxying to the old one (502)
# until it was reloaded — or refuse to start if one isn't up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# Request bodies are small JSON documents (ENGINEERING-STANDARDS.md §5).
client_max_body_size 1m;

# Header names with underscores are silently dropped by default; the real
# identity header's name isn't known yet (ticket #72), so don't risk it.
underscores_in_headers on;

# nginx's own redirects (e.g. `/api` -> `/api/`) would otherwise be built
# from its idea of the scheme and port — plain http, no port — which is
# wrong behind Mechatronics' TLS termination. Relative ones are right
# wherever the site is reached.
absolute_redirect off;

# Held in a variable so it is resolved per request (see `resolver`). Set here,
# at server level, so it exists before any location's `rewrite` runs.
set $backend http://backend:8000;

proxy_http_version 1.1;
proxy_set_header Connection "";
# `$http_host`, not `$host`: keeps the port the client actually used.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_connect_timeout 5s;
