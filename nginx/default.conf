# Reverse proxy (ticket #71). Serves one origin: `/` is the frontend, `/api/`
# is the backend (which mounts every route under `/api` itself, so nothing is
# rewritten). Plain HTTP on purpose — Mechatronics terminates TLS in front of
# this, and the box has no public IP (docs/adr/0004-...).
#
# Mechatronics' identity header is forwarded to the backend untouched, since
# the proxy passes every request header through by default.

# ADR-0002: the media access token travels in the query string of
# /api/media/stream, so it must never sit in plaintext in a proxy log.
# nginx's stock access log writes the whole request line, token included.
# For that endpoint log the path only and drop the query string outright —
# rather than trying to blank out `token=` inside it, which a repeated or
# oddly-encoded parameter would slip past. `$uri` is nginx's decoded,
# normalised path, so `/api/media/%73tream` is matched too.
map $uri $loggable_uri {
    ~^/api/media/stream  $uri;
    default              $request_uri;
}

log_format redacted '$remote_addr - "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout redacted;
    # nginx's error log quotes the full request line — query string and all —
    # on upstream failures, and unlike the access log it can't be redacted.
    # `crit` keeps startup/config failures (emerg) and drops those per-request
    # lines; a failed upstream still shows up as a 502 in the access log, with
    # the cause in `docker compose logs backend`.
    error_log /dev/stderr crit;

    # Docker's embedded DNS, with the upstreams held in variables so they are
    # looked up per request: a redeployed backend/frontend container gets a
    # new IP, and nginx would otherwise keep proxying to the old one (502)
    # until it was reloaded — or refuse to start if one isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Request bodies are small JSON documents (ENGINEERING-STANDARDS.md §5).
    client_max_body_size 1m;

    # Header names with underscores are silently dropped by default; the real
    # identity header's name isn't known yet (ticket #72), so don't risk it.
    underscores_in_headers on;

    # nginx's own redirects (e.g. `/api` -> `/api/`) would otherwise be built
    # from its idea of the scheme and port — plain http, no port — which is
    # wrong behind Mechatronics' TLS termination. Relative ones are right
    # wherever the site is reached.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # `$http_host`, not `$host`: keeps the port the client actually used.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;

        # Cut playback/download streams a whole video through here (with Range
        # requests for seeking). Buffering it would spool the file to disk
        # ahead of the client and keep doing so after the viewer navigates away.
        proxy_buffering off;
        # `/media/cuts/info` downloads a whole Cut from S3 and then runs ffprobe
        # before it answers a single byte, so the wait for the first byte —
        # not just the gap between chunks — can be long for a big file.
        # Bounded (rather than left open) per ENGINEERING-STANDARDS.md §5, but
        # generous: cutting it off earlier only makes the browser retry while
        # the backend is still working, which starts a second download.
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    location / {
        set $frontend http://frontend:4173;
        proxy_pass $frontend;
    }
}
