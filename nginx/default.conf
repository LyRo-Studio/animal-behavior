# Reverse proxy (ticket #71). Two listeners, both in front of the same
# frontend and backend:
#
#   :80    one origin — `/` is the frontend, `/api/` is the backend (which
#          mounts every route under `/api` itself, so nothing is rewritten).
#          This is what Mechatronics should forward the whole host to.
#   :8000  API only — for a Mechatronics route that sends `/api` to port 8000,
#          the port the backend used to be published on. See the server block.
#
# Plain HTTP on purpose — Mechatronics terminates TLS in front of this, and
# the box has no public IP (docs/adr/0004-...).
#
# Mechatronics' identity header is forwarded to the backend untouched, since
# the proxy passes every request header through by default.

# ADR-0002: the media access token travels in the query string of
# /api/media/stream, so it must never sit in plaintext in a proxy log.
# nginx's stock access log writes the whole request line, token included.
# For that endpoint log the path only and drop the query string outright —
# rather than trying to blank out `token=` inside it, which a repeated or
# oddly-encoded parameter would slip past. `$uri` is nginx's decoded,
# normalised path, so `/api/media/%73tream` is matched too; the prefix is
# optional so a request the :8000 listener rewrites is matched either way.
map $uri $loggable_uri {
    ~^(/api)?/media/stream  $uri;
    default                 $request_uri;
}

log_format redacted '$remote_addr - "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/server-common.conf;

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location / {
        set $frontend http://frontend:4173;
        proxy_pass $frontend;
    }
}

# API-only listener. Before #71 the backend was published on :8000 with no
# `/api` prefix, so a Mechatronics route written for that (`/api` -> :8000)
# may or may not keep the prefix when it forwards. Accept both: `/api/...` is
# passed through unchanged, and anything else gets `/api` put back. Never
# serves the frontend. A stopgap for that route, not a second front door —
# the intended setup is one upstream (:80) for the whole host.
server {
    listen 8000;
    server_name _;
    include /etc/nginx/snippets/server-common.conf;

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location / {
        # `break`: proxy the rewritten URI (query string is carried along).
        rewrite ^/(.*)$ /api/$1 break;
        include /etc/nginx/snippets/api-proxy.conf;
    }
}
