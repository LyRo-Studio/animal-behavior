[project]
name = "animal-behavior-worker"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# `../backend` resolves `app.*` to the backend's own source (see
# worker/Dockerfile's COPY steps for the runtime equivalent) — never a
# duplicated copy on disk for tests.
pythonpath = [".", "../backend"]
testpaths = ["tests"]
# Ticket #54: the real-GPU/real-image smoke test opts in via `-m real_gpu`
# (which overrides this default), so a plain `pytest` run — and CI, which
# has no GPU — never needs one or the real `dogtrace` package installed.
addopts = "-m \"not real_gpu\""
markers = [
    "real_gpu: exercises the real dogtrace package against a real CUDA GPU and the real S3 bucket (opt-in — run with `pytest -m real_gpu`)",
]
