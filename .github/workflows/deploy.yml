name: Deploy

on:
  # Fires once ci.yml finishes on master — never re-runs the checks itself.
  # `branches: [master]` filters on the branch the completed CI run was
  # for, so a PR's ci.yml run (head branch = the PR's branch) never
  # triggers a deploy.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Previously published tag to redeploy, e.g. sha-1a2b3c4 (rollback — skips build/push)"
        required: true
        type: string

# Serialize deploys on the one production box/runner — a rollback dispatched
# mid-deploy, or two master pushes in quick succession, must not race.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/lyro-studio/animal-behavior-backend
  FRONTEND_IMAGE: ghcr.io/lyro-studio/animal-behavior-frontend
  WORKER_IMAGE: ghcr.io/lyro-studio/animal-behavior-worker
  NGINX_IMAGE: ghcr.io/lyro-studio/animal-behavior-nginx

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # The runner registered on `dogtrace-app`, the production VM (ticket #69).
    # Deliberately not the `ci` runner on the development VM — deploy must
    # execute where the containers actually have to run (CONTEXT.md's
    # "CI/CD retarget" decision, ticket #70).
    runs-on: [self-hosted, linux, x64, production-deploy]
    # Gives this job access to the `production` Environment's secrets and
    # variables (used by "Generate .env" below) — and only this job, so
    # ci.yml's runner never sees production config at all.
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit ci.yml validated, not just whatever
          # HEAD happens to be when this job starts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Determine image tag
        id: image
        # Passed through `env:`, never `${{ }}`-interpolated into the script:
        # `image_tag` is free text typed by whoever dispatches the workflow,
        # so interpolating it would let it inject shell into a job that runs
        # on the production box with Docker access. It also flows into
        # multi-line `tags:` inputs below, hence the charset check.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
              echo "::error::image_tag must be a valid Docker tag (letters, digits, . _ -; max 128 chars)"
              exit 1
            fi
            echo "tag=$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail-fast: runs before anything is built or pushed, so a missing
      # secret costs seconds rather than a wasted multi-GB image build.
      #
      # Secrets/variables reach the script only through `env:` — never
      # interpolated into the script text itself — so a value can't inject
      # shell, and GitHub masks every `secrets.*` value in the log. Nothing
      # below ever prints `.env` or a value (errors name the variable only).
      - name: Generate .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MEDIA_TOKEN_SECRET_KEY: ${{ secrets.MEDIA_TOKEN_SECRET_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          # Optional — compose supplies a default when these are unset.
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          S3_ADDRESSING_STYLE: ${{ vars.S3_ADDRESSING_STYLE }}
          # May be empty until the real header name is discovered on
          # `dogtrace-app` (ticket #72's diagnostic step) — empty means the
          # backend reads no identity at all.
          IDENTITY_HEADER_NAME: ${{ vars.IDENTITY_HEADER_NAME }}
          # Vestigial in production since ticket #71: the site is one origin behind
          # nginx, so no cross-origin request is ever made. Kept optional in case a
          # value is still set; compose's default applies when it is empty.
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -euo pipefail
          # Never world-readable, not even for the instant before chmod.
          umask 077

          required=(
            POSTGRES_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            S3_BUCKET S3_ENDPOINT MEDIA_TOKEN_SECRET_KEY
          )
          optional=(
            POSTGRES_USER POSTGRES_DB S3_ADDRESSING_STYLE IDENTITY_HEADER_NAME
            CORS_ORIGINS
          )

          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing from the 'production' GitHub Environment (secret or variable): ${missing[*]}"
            exit 1
          fi

          # docker-compose.yml splices this into DATABASE_URL without URL-
          # encoding, so any of `@ / : ? # %` would corrupt the URL and leave
          # the backend unable to connect — fail here, not as a crash loop.
          if ! [[ "$POSTGRES_PASSWORD" =~ ^[A-Za-z0-9._~-]+$ ]]; then
            echo "::error::POSTGRES_PASSWORD may only contain letters, digits and . _ ~ - (it is embedded unescaped in DATABASE_URL)"
            exit 1
          fi

          tmp="$(mktemp .env.XXXXXX)"
          trap 'rm -f "$tmp"' EXIT

          # Single-quoted so docker compose reads the value literally — an
          # unquoted `$` in a password would otherwise be interpolated. A
          # single quote or line break can't be represented that way, so
          # reject it rather than write a mangled (or injected) line.
          emit() {
            case "$2" in
              *\'* | *$'\n'* | *$'\r'*)
                echo "::error::$1 contains a single quote or line break, which .env cannot represent"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$1" "$2" >> "$tmp"
          }

          for name in "${required[@]}"; do emit "$name" "${!name}"; done
          for name in "${optional[@]}"; do
            [ -z "${!name:-}" ] || emit "$name" "${!name}"
          done

          mv "$tmp" .env
          chmod 600 .env

      # Needed both to push the newly built images and to pull an existing
      # tag back down on a rollback dispatch.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Baked into the bundle at build time (frontend/Dockerfile). Fixed,
          # not an Environment variable (ticket #71): production is served
          # from one origin with nginx routing `/api` to the backend, so the
          # only correct value is the same-origin path. It used to be a
          # variable, and a stale absolute URL there broke the whole site
          # (mixed content, wrong host).
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

      # Build context is the repo root, not `worker` — `worker/Dockerfile`
      # itself needs it that way to COPY files out of `backend/app` (see
      # CONTEXT.md's "Analysis worker" > "Worker build context" decision).
      - name: Build and push worker image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ steps.image.outputs.tag }}
            ${{ env.WORKER_IMAGE }}:latest

      # Config-only image (nginx/Dockerfile) — the reverse proxy that is the
      # only thing published on the production box (ticket #71).
      - name: Build and push nginx image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: nginx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ steps.image.outputs.tag }}
            ${{ env.NGINX_IMAGE }}:latest

      - name: Deploy
        env:
          BACKEND_IMAGE_REF: ${{ env.BACKEND_IMAGE }}:${{ steps.image.outputs.tag }}
          FRONTEND_IMAGE_REF: ${{ env.FRONTEND_IMAGE }}:${{ steps.image.outputs.tag }}
          WORKER_IMAGE_REF: ${{ env.WORKER_IMAGE }}:${{ steps.image.outputs.tag }}
          NGINX_IMAGE_REF: ${{ env.NGINX_IMAGE }}:${{ steps.image.outputs.tag }}
        # --profile worker: `worker` sits behind Compose's `profiles:
        # ["worker"]` gate (ticket #47 — keeps a GPU-less `docker compose
        # up` from failing outright on a machine without one). Without this
        # flag here, `worker` would silently never start on deploy even
        # with its image built/pushed/overridden correctly — found and
        # filed as a gap in this ticket's own issue comment before this was
        # implemented, since backend/frontend health-checking successfully
        # would otherwise mask it indefinitely.
        # --pull always: always fetch the exact tag from GHCR rather than
        # trusting whatever local image cache happens to be on the box.
        # --no-build: docker-compose.prod.yml layers `image:` on top of the
        # base file's `build:` — this guarantees compose uses the pulled
        # image rather than rebuilding from source on the box.
        # --wait: blocks until db/backend/frontend/nginx all report healthy, and
        # worker (no healthcheck of its own) is at least running (or fails
        # the step — see docker-compose.yml's healthchecks). Timeout was
        # 300s (sized for the db ~50s -> backend ~55s -> frontend ~55s
        # sequential health chain, ~160s, plus pull headroom); bumped to
        # 600s now that a slow `--pull always` also has to fetch worker's
        # image, built FROM a CUDA/torch/ultralytics base that's multiple
        # GB larger than backend/frontend's.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile worker \
            up -d --pull always --no-build --wait --wait-timeout 600
