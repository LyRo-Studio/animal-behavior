name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    # `ci` marks the runner on the development VM (`lynn-delaere`) — test/lint/
    # build only. Deploys run on `dogtrace-app`'s `production-deploy` runner
    # (deploy.yml), so CI never touches production secrets or the production
    # box (ticket #70). Keep this label off any runner that also has
    # `production-deploy`, or CI would start running on the production VM.
    runs-on: [self-hosted, linux, x64, ci]

    # Real Postgres, migrated through Alembic — matches backend/tests/conftest.py's
    # "never SQLite or a mocked ORM" testing decision (issue #1). Published on 5433,
    # not Postgres's default 5432, so this never collides with a `db` container
    # from docker-compose.yml that may be running on this same box (ADR-0003).
    # Bound to 127.0.0.1 only — this runner is reachable over the tailnet; an
    # unbound 0.0.0.0 publish would expose these (trivial, throwaway)
    # credentials to anything on the tailnet for the job's duration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animal_behavior
          POSTGRES_PASSWORD: animal_behavior
          POSTGRES_DB: animal_behavior
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U animal_behavior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://animal_behavior:animal_behavior@localhost:5433/animal_behavior

    steps:
      - uses: actions/checkout@v4
        with:
          # deploy.yml no longer runs on this runner (ticket #70), but this
          # workspace may still hold the `.env` of the stack earlier deploys
          # started on this box — the default `git clean -ffdx` would delete
          # that gitignored file. Safe to drop once that old stack is gone.
          clean: false

      # actions/setup-python can only fetch a prebuilt interpreter for GitHub's
      # supported runner-OS images — this runner's host (Debian 13) isn't one of
      # them, so setup-python fails outright here. pyproject.toml only requires
      # >=3.12, so the system python3 (3.13, already installed on the box) via a
      # per-run venv works fine and needs no external download.
      - name: Install dependencies
        working-directory: backend
        # `clean: false` above means a stale .venv from a previous run would
        # otherwise survive too, and `python3 -m venv` re-run against an
        # existing venv doesn't remove packages no longer in
        # requirements.txt — recreate it fresh instead.
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        working-directory: backend
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: .venv/bin/ruff format --check .

      - name: Test (pytest)
        working-directory: backend
        # Default addopts already excludes the real_bucket-marked smoke test
        # (ticket #23) — no S3 credentials needed here.
        run: .venv/bin/pytest

  worker:
    runs-on: [self-hosted, linux, x64, ci]

    # Its own throwaway Postgres, same reasoning as the backend job's above
    # — a different port (5434) so the two jobs never collide even if this
    # runner ever runs them concurrently.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animal_behavior
          POSTGRES_PASSWORD: animal_behavior
          POSTGRES_DB: animal_behavior
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U animal_behavior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://animal_behavior:animal_behavior@localhost:5434/animal_behavior

    steps:
      - uses: actions/checkout@v4
        with:
          # See the backend job's checkout step above — same reasoning.
          clean: false

      - name: Install dependencies
        working-directory: worker
        # worker/pyproject.toml's `pythonpath` points `app.*` straight at
        # ../backend's own source (ticket #47's "reuse, not a package
        # install" decision) — this venv only needs worker/requirements*.txt
        # installed, never backend's.
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        working-directory: worker
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        working-directory: worker
        run: .venv/bin/ruff format --check .

      - name: Test (pytest)
        working-directory: worker
        run: .venv/bin/pytest

  cutting-worker:
    runs-on: [self-hosted, linux, x64, ci]

    # Its own throwaway Postgres, same reasoning as the `worker` job's above
    # — a different port (5435) so no two jobs on this runner ever collide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animal_behavior
          POSTGRES_PASSWORD: animal_behavior
          POSTGRES_DB: animal_behavior
        ports:
          - 127.0.0.1:5435:5432
        options: >-
          --health-cmd "pg_isready -U animal_behavior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://animal_behavior:animal_behavior@localhost:5435/animal_behavior

    steps:
      - uses: actions/checkout@v4
        with:
          # See the backend job's checkout step above — same reasoning.
          clean: false

      - name: Install dependencies
        working-directory: cutting-worker
        # cutting-worker/pyproject.toml's `pythonpath` points `app.*` straight
        # at ../backend's own source (ticket #95, mirroring worker/pyproject
        # .toml's own "reuse, not a package install" decision) — this venv
        # only needs cutting-worker/requirements.txt + requirements-dev.txt,
        # never requirements-assist.txt (vendored `assist`'s ffmpeg/scipy
        # stack only exists inside a container built from
        # cutting-worker/Dockerfile — see pyproject.toml's addopts comment).
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        working-directory: cutting-worker
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        working-directory: cutting-worker
        run: .venv/bin/ruff format --check .

      - name: Test (pytest)
        working-directory: cutting-worker
        run: .venv/bin/pytest

  frontend:
    runs-on: [self-hosted, linux, x64, ci]

    steps:
      - uses: actions/checkout@v4
        with:
          # See the backend job's checkout step above — same reasoning.
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Format check (prettier)
        working-directory: frontend
        run: npm run format

      - name: Typecheck (vue-tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        # vite build only — vue-tsc already ran as the Typecheck step above;
        # `npm run build` would repeat it a second time for no benefit.
        run: npx vite build

  # Ticket #71: runs the real nginx/default.conf in front of stub upstreams —
  # routing, the identity header, and (ADR-0002) that the media token never
  # reaches a log. Uses the runner's own Docker, like the Postgres service
  # containers above; it never starts the application stack.
  nginx:
    runs-on: [self-hosted, linux, x64, ci]

    steps:
      - uses: actions/checkout@v4
        with:
          # See the backend job's checkout step above — same reasoning.
          clean: false

      - name: Test (nginx/test.sh)
        run: bash nginx/test.sh
