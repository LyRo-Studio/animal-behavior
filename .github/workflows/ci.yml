name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: [self-hosted, linux, x64, production]

    # Real Postgres, migrated through Alembic — matches backend/tests/conftest.py's
    # "never SQLite or a mocked ORM" testing decision (issue #1). Published on 5433,
    # not Postgres's default 5432, so this never collides with the production `db`
    # container already running on this same box (docker-compose.yml, ADR-0003).
    # Bound to 127.0.0.1 only — this runner lives on the production box, reachable
    # over the tailnet; an unbound 0.0.0.0 publish would expose these (trivial,
    # throwaway) credentials to anything on the tailnet for the job's duration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animal_behavior
          POSTGRES_PASSWORD: animal_behavior
          POSTGRES_DB: animal_behavior
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U animal_behavior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://animal_behavior:animal_behavior@localhost:5433/animal_behavior

    steps:
      - uses: actions/checkout@v4
        with:
          # This runner's workspace is shared with deploy.yml, which reads
          # the production `.env` sitting in it (see deploy.yml). The
          # default `git clean -ffdx` here would delete that gitignored
          # file before deploy.yml ever runs.
          clean: false

      # actions/setup-python can only fetch a prebuilt interpreter for GitHub's
      # supported runner-OS images — this runner's host (Debian 13) isn't one of
      # them, so setup-python fails outright here. pyproject.toml only requires
      # >=3.12, so the system python3 (3.13, already installed on the box) via a
      # per-run venv works fine and needs no external download.
      - name: Install dependencies
        working-directory: backend
        # `clean: false` above (needed to preserve the box's .env) means a
        # stale .venv from a previous run would otherwise survive too, and
        # `python3 -m venv` re-run against an existing venv doesn't remove
        # packages no longer in requirements.txt — recreate it fresh instead.
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        working-directory: backend
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: .venv/bin/ruff format --check .

      - name: Test (pytest)
        working-directory: backend
        # Default addopts already excludes the real_bucket-marked smoke test
        # (ticket #23) — no S3 credentials needed here.
        run: .venv/bin/pytest

  worker:
    runs-on: [self-hosted, linux, x64, production]

    # Its own throwaway Postgres, same reasoning as the backend job's above
    # — a different port (5434) so the two jobs never collide even if this
    # runner ever runs them concurrently.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animal_behavior
          POSTGRES_PASSWORD: animal_behavior
          POSTGRES_DB: animal_behavior
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U animal_behavior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://animal_behavior:animal_behavior@localhost:5434/animal_behavior

    steps:
      - uses: actions/checkout@v4
        with:
          # See the backend job's checkout step above — same shared-workspace
          # reasoning.
          clean: false

      - name: Install dependencies
        working-directory: worker
        # worker/pyproject.toml's `pythonpath` points `app.*` straight at
        # ../backend's own source (ticket #47's "reuse, not a package
        # install" decision) — this venv only needs worker/requirements*.txt
        # installed, never backend's.
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        working-directory: worker
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        working-directory: worker
        run: .venv/bin/ruff format --check .

      - name: Test (pytest)
        working-directory: worker
        run: .venv/bin/pytest

  frontend:
    runs-on: [self-hosted, linux, x64, production]

    steps:
      - uses: actions/checkout@v4
        with:
          # See the backend job's checkout step above — same shared-workspace
          # reasoning.
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Format check (prettier)
        working-directory: frontend
        run: npm run format

      - name: Typecheck (vue-tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        # vite build only — vue-tsc already ran as the Typecheck step above;
        # `npm run build` would repeat it a second time for no benefit.
        run: npx vite build
