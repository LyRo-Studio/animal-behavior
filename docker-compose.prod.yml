# Production override for deploy.yml — applied with `-f docker-compose.yml
# -f docker-compose.prod.yml` on the production box only. Points `backend`/
# `frontend`/`worker` at an already-built, already-pushed GHCR image tag
# instead of the base file's `build:` context, so the deploy step never
# rebuilds on the box. A plain local `docker compose up` (no `-f` override)
# never loads this file and keeps building from source unchanged.
#
# Only `nginx` publishes a host port (ticket #71): backend and frontend are
# reachable on the internal Docker network only.
services:
  backend:
    image: ${BACKEND_IMAGE_REF:?Set BACKEND_IMAGE_REF (see .github/workflows/deploy.yml)}

  frontend:
    image: ${FRONTEND_IMAGE_REF:?Set FRONTEND_IMAGE_REF (see .github/workflows/deploy.yml)}

  # `worker` keeps its base-file `profiles: ["worker"]` gate and GPU
  # `deploy.resources` block unchanged (ticket #47) — this only swaps its
  # `build:` for an `image:`, same as backend/frontend above.
  worker:
    image: ${WORKER_IMAGE_REF:?Set WORKER_IMAGE_REF (see .github/workflows/deploy.yml)}

  # `cutting-worker` keeps its base-file `profiles: ["cutting-worker"]` gate
  # unchanged (ticket #95) — this only swaps its `build:` for an `image:`,
  # same as `worker` above.
  cutting-worker:
    image: ${CUTTING_WORKER_IMAGE_REF:?Set CUTTING_WORKER_IMAGE_REF (see .github/workflows/deploy.yml)}

  # 5173 is the port Mechatronics forwards dogtrace.mechatronics.be to — kept
  # so nginx replaces the frontend there without any change on their side.
  # 8000 is nginx's API-only listener, for a Mechatronics `/api` route that
  # still points at the port the backend used to be published on (see
  # nginx/default.conf). It reaches nginx, never the backend directly.
  nginx:
    image: ${NGINX_IMAGE_REF:?Set NGINX_IMAGE_REF (see .github/workflows/deploy.yml)}
    ports:
      - "5173:80"
      - "8000:8000"
